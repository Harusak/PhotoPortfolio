  // photo scrubber under the photo: drag (touch) or hover (mouse) previews photos only; release / click moves the text there
  scrubIdx(e) { const r = e.currentTarget.getBoundingClientRect(); return cl(Math.floor((e.clientX - r.left) / Math.max(1, r.width) * PHOTOS.length), 0, PHOTOS.length - 1); }
  scrubDown = e => { this.drag = { x: e.clientX }; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} this.setState({ peek: this.scrubIdx(e) }); };
  scrubMove = e => { if (!this.drag && e.pointerType !== "mouse") return; const i = this.scrubIdx(e); if (i !== this.state.peek) this.setState({ peek: i }); };
  scrubUp = e => { if (!this.drag) return; this.drag = null; this.suppress = Date.now() + 400; this.jumpPhoto(this.scrubIdx(e)); };
  scrubCancel = () => { this.drag = null; this.setState({ peek: null }); };
  scrubLeave = e => { if (!this.drag && e.pointerType === "mouse") this.setState({ peek: null }); };
  jumpPhoto(i) {
    const k = SCENES.findIndex(sc => sc.ph === i && !sc.end);
    clearTimeout(this.t4); this.t4 = setTimeout(() => this.setState({ target: null }), 1800);
    this.setState({ peek: null, target: SCENES[this.state.act].ph === i ? null : i });
    this.center(k, true, false);
  }
  go(d) { this.center(cl(this.state.act + d, 0, SCENES.length - 1), true, d < 0); }
  renderVals() {
    const s = this.state, on = this.props.dof ?? true;
    const theme = s.theme || (this.props.dark ? "dark" : "light"), T = THEMES[theme];
    const font = FONTS[(this.props.bodyFont || "mincho") === "mincho" ? "mincho" : "gothic"];
    const cueOn = s.cueReady && s.act === 0 && !s.seen, cueK = this.props.cue || "chevron";
    const ph = SCENES[s.act].ph, shown = s.peek != null ? s.peek : s.target != null ? s.target : ph;
    const scenes = SCENES.map((sc, i) => {
      const d = Math.abs(i - s.act);
      const lg = !!s.long[i];
      return { i, isLong: lg, smEnd: s.edge + 16 + "px", snap: lg ? "start" : "center", sm: (lg ? s.edge : 0) + "px", isTitle: i === 0, isEnd: !!sc.end, hasNo: i > 0 && !sc.end, no: pad2(sc.ph + 1),
        flt: "blur(" + (on ? [0, 3, 6][Math.min(d, 2)] : 0) + "px)", op: cueOn && cueK === "nudge" && i === 1 ? 0.6 : [1, 0.4, 0.18, 0][Math.min(d, 3)],
        anim: cueOn && cueK === "nudge" ? "nudge 2.6s cubic-bezier(.3,0,.2,1) .3s infinite" : "none",
        blocks: sc.blocks.map(b => ({ isP: b.t === "p", isH: b.t === "h", text: b.x })) };
    });
    const stack = PHOTOS.map((p, i) => {
      const d = i - shown;
      const v = d === 0 ? ["none", 0, 1, 5] : d === 1 ? ["translate(5%,-4%) scale(.9)", 7, 0.3, 4] : d < 0 ? ["translate(-3%,4%) scale(1.05)", 10, 0, 6] : ["translate(8%,-6%) scale(.84)", 10, 0, 3];
      return { src: p.f, cap: p.cap, label: "写真を拡大：" + p.cap, tab: d === 0 ? 0 : -1, dur: s.peek != null ? ".3s" : ".9s", tr: v[0], flt: "blur(" + (on ? v[1] : 0) + "px)", op: v[2], z: v[3], pe: d === 0 ? "auto" : "none",
        open: () => this.setState({ pop: p, tilt: { nx: 0, ny: 0 } }) };
    });
    const P = s.pop, { nx, ny } = s.tilt, last = SCENES.length - 1;
    return {
      vars: Object.keys(T).map(k => "--" + k + ":" + T[k]).join(";"),
      font, padPx: s.pad + "px", scenes, scRef: this.scRef, onScroll: this.onScroll,
      prev: () => this.go(-1), next: () => this.go(1), prevOp: s.act === 0 ? 0.25 : 1, nextOp: s.act === last ? 0.25 : 1,
      hint: s.act === last ? "End" : s.long[s.act] ? "Reading " + pad2(ph + 1) + " · " + (s.prog >= 100 ? "end ↓" : s.prog + "%") : "Scroll — 1 scene",
      stack, no: pad2(shown + 1) + " / " + pad2(PHOTOS.length), cap: PHOTOS[shown].cap,
      bars: PHOTOS.map((p, i) => ({ op: i === shown ? 1 : i === ph ? 0.55 : 0.22, h: i === shown && s.peek != null ? "3px" : "1px", label: "写真 " + pad2(i + 1) + "「" + p.cap + "」のシーンへ",
        go: () => { if (Date.now() < (this.suppress || 0)) return; this.jumpPhoto(i); } })),
      scrubDown: this.scrubDown, scrubMove: this.scrubMove, scrubUp: this.scrubUp, scrubCancel: this.scrubCancel, scrubLeave: this.scrubLeave,
      progOp: s.long[s.act] ? 1 : 0, progH: s.prog + "%", progEnd: s.long[s.act] && s.prog >= 100 ? "var(--ink)" : "var(--bg)",
      cueOp: cueOn && cueK !== "nudge" ? 1 : 0, cueTr: cueOn ? "translateY(0)" : "translateY(8px)",
      cue: { line: cueK === "line", chevron: cueK === "chevron", dot: cueK === "dot", label: cueK === "label", box: cueK === "box" },
      toggleTheme: () => this.setState({ theme: theme === "dark" ? "light" : "dark" }),
      themeLabel: theme === "dark" ? "Dark" : "Light", dotBg: theme === "dark" ? "currentColor" : "transparent",
      popOpen: !!P,
      pop: { src: P ? P.f : "", cap: P ? P.cap : "", page: P ? P.page : "#",
        tr: "perspective(1000px) rotateX(" + (-ny * 15).toFixed(2) + "deg) rotateY(" + (nx * 15).toFixed(2) + "deg)",
        glare: "radial-gradient(circle at " + ((nx + 1) / 2 * 100).toFixed(1) + "% " + ((ny + 1) / 2 * 100).toFixed(1) + "%, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.15) 20%, transparent 50%)" },
      closePop: () => this.setState({ pop: null }),
      tiltMove: e => { const r = e.currentTarget.getBoundingClientRect(); this.setState({ tilt: { nx: cl((e.clientX - r.left - r.width / 2) / (r.width * 0.35), -1, 1), ny: cl((e.clientY - r.top - r.height / 2) / (r.height * 0.35), -1, 1) } }); }
    };
  }
}
