# .github/workflows/pages.yml
# Settings → Pages → Source: "GitHub Actions" に切り替えてから使う
# action のバージョンは記述時点のもの。Node 24 対応の最新メジャー版を確認すること
name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"   # 毎日 03:00 JST に Flickr を再取得
  workflow_dispatch:        # Actions タブから手動実行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch Flickr albums
        run: node scripts/fetch-flickr.mjs
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          FLICKR_USER_ID: ${{ vars.FLICKR_USER_ID }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
