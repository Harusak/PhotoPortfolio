<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg,#e1dfda);color:var(--ink,#1c1b19);font-family:'IBM Plex Mono',monospace;-webkit-font-smoothing:antialiased;transition:background-color .5s ease}
a{color:inherit;text-decoration:none}
a:hover{opacity:.65}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="min-height:100vh;background:var(--bg,#e1dfda);color:var(--ink,#1c1b19);transition:background-color .5s ease, color .5s ease">

  <header style="position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px clamp(20px,4vw,48px);background:linear-gradient(var(--bg,#e1dfda) 45%, var(--bg0,rgba(225,223,218,0)));transition:background .5s ease">
    <div style="display:flex;align-items:baseline;gap:12px;min-width:0;font-family:'Instrument Serif','Shippori Mincho',serif;font-size:clamp(20px,2.2vw,26px);line-height:1;white-space:nowrap">
      <a href="#" onClick="{{ goTop }}">Hal Sakaguchi</a>
      <a href="#" onClick="{{ goAlbums }}" aria-hidden="{{ sufHidden }}" style="display:flex;align-items:center;gap:12px;color:var(--sub,#5f5b55);opacity:{{ sufOp }};transform:{{ sufTr }};pointer-events:{{ sufPe }};transition:opacity .45s ease, transform .6s cubic-bezier(.2,.7,.2,1)">
        <span style="width:1px;height:0.85em;background:var(--line,rgba(28,27,25,0.35))"></span><span>Albums</span>
      </a>
    </div>
    <nav style="display:flex;gap:clamp(14px,2.4vw,32px);align-items:center;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--sub,#5f5b55)">
      <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><a href="#" onClick="{{ goTop }}" style="color:var(--ink,#1c1b19)">Gallery</a></sc-if>
      <a href="#">Journal</a>
      <a href="#">About</a>
      <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><a href="https://www.instagram.com/saka.hal_" target="_blank">IG</a></sc-if>
      <button onClick="{{ toggleTheme }}" aria-label="ライト／ダーク切り替え" style="display:flex;align-items:center;gap:8px;background:none;border:0;padding:14px 0;margin:-14px 0;cursor:pointer;letter-spacing:inherit;text-transform:inherit;color:inherit">
        <span style="width:9px;height:9px;border-radius:50%;border:1px solid currentColor;background:{{ dotBg }};transition:background .3s"></span>
        <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><span>{{ themeLabel }}</span></sc-if>
      </button>
    </nav>
  </header>

  <sc-if value="{{ isTop }}" hint-placeholder-val="{{ true }}">
    <main style="display:flex;flex-direction:column">
      <section data-screen-label="Top / Hero" style="height:100vh;min-height:560px;position:relative;display:flex;align-items:center;justify-content:center;padding:96px clamp(16px,4vw,48px) 108px">
        <div style="position:relative;width:{{ heroW }};aspect-ratio:{{ heroAR }}">
          <sc-for list="{{ hero }}" as="l" hint-placeholder-count="3">
            <img src="{{ l.src }}" alt="{{ l.alt }}" onClick="{{ l.go }}" style="position:absolute;left:{{ l.left }};top:{{ l.top }};width:{{ l.w }};height:{{ l.h }};object-fit:cover;cursor:pointer;z-index:{{ l.z }};filter:{{ l.flt }};opacity:{{ l.op }};transform:{{ l.tr }};box-shadow:0 40px 80px -30px var(--shadow,rgba(40,35,30,0.45));transition:filter 1.4s ease, opacity 1.4s ease, transform 1.4s cubic-bezier(.2,.7,.2,1)">
          </sc-for>
        </div>
        <div style="position:absolute;left:clamp(20px,4vw,48px);right:clamp(20px,4vw,48px);bottom:28px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--sub,#5f5b55)">
          <div style="display:flex;gap:18px;align-items:baseline;min-width:0">
            <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><span>In focus</span></sc-if>
            <span style="font-family:'Instrument Serif','Shippori Mincho',serif;font-size:20px;text-transform:none;letter-spacing:0;color:var(--ink,#1c1b19);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ heroTitle }}</span>
          </div>
          <button onClick="{{ goAlbums }}" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;background:none;border:1px solid var(--line,rgba(28,27,25,0.35));cursor:pointer;letter-spacing:inherit;text-transform:inherit;color:var(--ink,#1c1b19);transition:background .25s, color .25s" style-hover="background:var(--ink,#1c1b19);color:var(--bg,#e1dfda)">
            <span>Albums</span><span>↓</span>
          </button>
          <div style="justify-self:end;display:flex;gap:8px;align-items:center">
            <sc-for list="{{ hero }}" as="l" hint-placeholder-count="3"><span style="width:28px;height:1px;background:var(--ink,#1c1b19);opacity:{{ l.tick }};transition:opacity 0.6s"></span></sc-for>
          </div>
        </div>
      </section>

      <section data-screen-label="Top / Albums" style="padding:64px clamp(16px,4vw,48px) 96px;display:flex;flex-direction:column;gap:24px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule,rgba(28,27,25,0.14));padding-bottom:14px">
          <h2 ref="{{ headRef }}" style="margin:0;font-family:'Instrument Serif','Shippori Mincho',serif;font-weight:400;font-size:clamp(34px,4vw,48px);line-height:1;opacity:{{ headOp }};transition:opacity .45s ease">Albums</h2>
          <span style="font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--sub,#5f5b55)">{{ focusLabel }}</span>
        </div>
        <div ref="{{ fieldRef }}" onMouseMove="{{ fieldMove }}" onMouseLeave="{{ fieldLeave }}" style="position:relative;width:100%;aspect-ratio:{{ fieldAR }}">
          <sc-for list="{{ albums }}" as="i" hint-placeholder-count="5">
            <a href="#" onClick="{{ i.open }}" onMouseEnter="{{ i.enter }}" onMouseLeave="{{ i.leave }}" style="position:absolute;left:{{ i.left }};top:{{ i.top }};width:{{ i.w }};z-index:{{ i.z }};display:flex;flex-direction:column;gap:10px;cursor:pointer;filter:{{ i.flt }};opacity:{{ i.op }};transform:{{ i.tr }};transition:filter 0.7s ease, opacity 0.7s ease, transform 1s cubic-bezier(.2,.7,.2,1)">
              <img src="{{ i.src }}" alt="{{ i.title }}" style="width:100%;aspect-ratio:4/5;object-fit:cover;display:block;box-shadow:0 30px 60px -30px var(--shadow,rgba(40,35,30,0.45))">
              <div style="display:flex;gap:12px;align-items:baseline"><span style="font-size:10px;letter-spacing:0.12em;color:var(--sub,#5f5b55)">{{ i.idx }}</span><span style="font-family:'Instrument Serif','Shippori Mincho',serif;font-size:18px">{{ i.title }}</span><span style="margin-left:auto;font-size:10px;letter-spacing:0.12em;color:var(--sub,#5f5b55)">{{ i.count }}</span></div>
            </a>
          </sc-for>
        </div>
      </section>

      <footer style="padding:32px clamp(20px,4vw,48px);display:flex;justify-content:space-between;gap:16px;font-size:11px;letter-spacing:0.12em;color:var(--sub,#5f5b55);border-top:1px solid var(--rule,rgba(28,27,25,0.14))">
        <span>© Hal Sakaguchi</span><span>Photographs</span>
      </footer>
    </main>
  </sc-if>

  <sc-if value="{{ isAlbum }}" hint-placeholder-val="{{ false }}">
    <main data-screen-label="Album" ref="{{ albumRef }}" onTouchStart="{{ tStart }}" onTouchEnd="{{ tEnd }}" style="position:fixed;inset:0;overflow:hidden;background:var(--bg,#e1dfda);touch-action:pan-y;transition:background-color .5s ease">
      <div style="position:absolute;top:76px;left:0;right:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:16px;padding:0 clamp(20px,4vw,48px);font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--sub,#5f5b55)">
        <button onClick="{{ goAlbums }}" style="justify-self:start;background:none;border:0;padding:8px 0;cursor:pointer;letter-spacing:inherit;text-transform:inherit;color:inherit">← Albums</button>
        <span style="font-family:'Instrument Serif','Shippori Mincho',serif;font-size:26px;letter-spacing:0;text-transform:none;color:var(--ink,#1c1b19)">{{ albumTitle }}</span>
        <span style="justify-self:end">{{ count }}</span>
      </div>
      <sc-for list="{{ track }}" as="p" hint-placeholder-count="5">
        <img src="{{ p.src }}" alt="{{ p.alt }}" onClick="{{ p.go }}" style="position:absolute;left:50%;top:calc(50% + 10px);width:auto;height:auto;max-height:{{ p.ph }};max-width:{{ p.pw }};display:block;cursor:{{ p.cur }};z-index:{{ p.z }};transform:{{ p.tr }};filter:{{ p.flt }};opacity:{{ p.op }};box-shadow:0 40px 80px -30px var(--shadow,rgba(40,35,30,0.45));transition:transform 0.9s cubic-bezier(.2,.7,.2,1), filter 0.9s ease, opacity 0.9s ease">
      </sc-for>
      <div style="position:absolute;bottom:28px;left:0;right:0;z-index:20;display:flex;justify-content:center;align-items:center;gap:32px;font-size:11px;letter-spacing:0.16em;color:var(--sub,#5f5b55)">
        <button onClick="{{ prev }}" aria-label="前へ" style="background:none;border:0;cursor:pointer;padding:12px 14px;color:inherit;opacity:{{ prevOp }}">←</button>
        <span style="font-family:'Instrument Serif','Shippori Mincho',serif;font-size:18px;letter-spacing:0;color:var(--ink,#1c1b19);min-width:120px;text-align:center">{{ photoTitle }}</span>
        <button onClick="{{ next }}" aria-label="次へ" style="background:none;border:0;cursor:pointer;padding:12px 14px;color:inherit;opacity:{{ nextOp }}">→</button>
      </div>
    </main>
  </sc-if>

  <sc-if value="{{ lbOpen }}" hint-placeholder-val="{{ false }}">
    <div onMouseMove="{{ onTilt }}" onMouseLeave="{{ resetTilt }}" onClick="{{ closeLb }}" style="position:fixed;inset:0;background:rgba(20,19,17,0.9);backdrop-filter:blur(20px);z-index:200;cursor:zoom-out">
      <div style="position:absolute;left:50%;top:50%;margin-top:-28px;transform:{{ lbTransform }};max-width:90vw;max-height:calc(100vh - 156px);overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,0.5);transition:transform 0.1s ease">
        <img src="{{ lbSrc }}" alt="{{ lbAlt }}" style="display:block;max-width:90vw;max-height:calc(100vh - 156px)">
        <div style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(115deg,transparent 0%,rgba(0,231,255,0.10) 20%,rgba(102,126,234,0.15) 40%,rgba(235,139,255,0.15) 60%,rgba(0,231,255,0.10) 80%,transparent 100%)"></div>
        <div style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:{{ lbGlare }}"></div>
      </div>
      <div style="position:absolute;left:clamp(20px,4vw,48px);right:clamp(20px,4vw,48px);bottom:24px;display:flex;justify-content:center;flex-wrap:wrap;gap:12px 28px;align-items:center;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#a9a49b">
        <span style="font-family:'Instrument Serif','Shippori Mincho',serif;font-size:20px;letter-spacing:0;text-transform:none;color:#e4e1db">{{ lbAlt }}</span>
        <a href="{{ lbPage }}" target="_blank" rel="noopener" onClick="{{ stopProp }}" style="display:flex;align-items:center;gap:10px;min-height:40px;padding:0 16px;border:1px solid rgba(228,225,219,0.35);color:#e4e1db;cursor:pointer;transition:background .25s, color .25s" style-hover="background:#e4e1db;color:#1c1b19;opacity:1">
          <span>View on Flickr</span><span>↗</span>
        </a>
        <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><span>Esc で閉じる</span></sc-if>
      </div>
      <button onClick="{{ closeLb }}" aria-label="閉じる" style="position:absolute;top:20px;right:20px;width:44px;height:44px;border:1px solid rgba(228,225,219,0.3);background:none;color:#e4e1db;cursor:pointer;font-size:16px">×</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PH = [
  { id: "53098018469", src: "https://live.staticflickr.com/65535/53098018469_eb8b162a71_k.jpg", alt: "残影" },
  { id: "54988921054", src: "https://live.staticflickr.com/65535/54988921054_6c0a617fb4_b.jpg", alt: "タイトル1" },
  { id: "53324907283", src: "https://live.staticflickr.com/65535/53324907283_21ad32570c_h.jpg", alt: "タイトル2" },
  { id: "53325019104", src: "https://live.staticflickr.com/65535/53325019104_ccc4d609a1_h.jpg", alt: "タイトル3" },
  { id: "52901207351", src: "https://live.staticflickr.com/65535/52901207351_ce67bc5509_k.jpg", alt: "タイトル4" }
];
const ALBUMS = [["残影", 0], ["Portraits", 1], ["Travel 2023", 3], ["Travel 2024", 2], ["Landscape", 4]];
const DIST = ["0.8", "1.2", "2", "3.5", "6"];
const THEMES = {
  light: { bg: "#e1dfda", bg0: "rgba(225,223,218,0)", ink: "#1c1b19", sub: "#5f5b55", rule: "rgba(28,27,25,0.14)", line: "rgba(28,27,25,0.35)", shadow: "rgba(40,35,30,0.45)" },
  dark: { bg: "#161513", bg0: "rgba(22,21,19,0)", ink: "#e4e1db", sub: "#948f86", rule: "rgba(228,225,219,0.14)", line: "rgba(228,225,219,0.35)", shadow: "rgba(0,0,0,0.7)" }
};
const HERO = {
  wide: { W: 1200, H: 760, L: [{ id: 0, x: 330, y: 130, w: 540, h: 380 }, { id: 3, x: 800, y: 60, w: 300, h: 390 }, { id: 2, x: 110, y: 420, w: 300, h: 230 }] },
  narrow: { W: 400, H: 620, L: [{ id: 0, x: 20, y: 70, w: 360, h: 250 }, { id: 3, x: 210, y: 300, w: 170, h: 220 }, { id: 2, x: 10, y: 380, w: 190, h: 140 }] }
};
const FIELD = { wide: { W: 1200, H: 760, base: 290, step: 42 }, narrow: { W: 400, H: 1300, base: 230, step: 26 } };
const pad = n => String(n).padStart(2, "0");
const rnd = (a, b) => a + Math.random() * (b - a);
const pct = (v, t) => (v / t * 100).toFixed(3) + "%";

function genField(mode) {
  const F = FIELD[mode];
  for (let tries = 0; tries < 80; tries++) {
    const zs = [0, 1, 2, 3, 4].sort(() => Math.random() - 0.5), out = [];
    for (const z of zs) {
      const w = Math.round(F.base - z * F.step + rnd(-8, 8)), h = w * 1.25 + 38;
      let ok = null;
      for (let k = 0; k < 300 && !ok; k++) {
        const x = Math.round(rnd(0, F.W - w)), y = Math.round(rnd(0, F.H - h));
        if (out.every(o => x + w + 32 < o.x || o.x + o.w + 32 < x || y + h + 28 < o.y || o.y + o.h + 28 < y)) ok = { x, y, w, h, z };
      }
      if (!ok) break;
      out.push(ok);
    }
    if (out.length === 5) return out;
  }
  return ALBUMS.map((_, i) => ({ z: i, w: F.base - i * F.step, x: mode === "wide" ? [40, 420, 760, 260, 980][i] : [0, 200, 20, 220, 60][i], y: mode === "wide" ? [40, 260, 60, 520, 400][i] : [0, 420, 560, 900, 1080][i] }));
}
function genOffsets(n) {
  const o = [];
  for (let i = 0; i < n; i++) { let v, k = 0; do { v = rnd(-1, 1); } while (i > 0 && Math.abs(v - o[i - 1]) < 0.55 && ++k < 50); o.push(v); }
  return o;
}
const modeOf = () => (typeof window !== "undefined" && window.innerWidth < 760 ? "narrow" : "wide");
function applyTheme(t) {
  const r = document.documentElement, v = THEMES[t];
  Object.keys(v).forEach(k => r.style.setProperty("--" + k, v[k]));
  r.style.colorScheme = t;
}

class Component extends DCLogic {
  constructor(p) {
    super(p);
    this._fields = {};
    let theme = "light";
    try { theme = localStorage.getItem("theme") === "dark" ? "dark" : "light"; } catch (e) {}
    applyTheme(theme);
    this.state = { view: "top", hov: -1, m: { x: 0.5, y: 0.5 }, focus: Math.floor(Math.random() * 3), album: 0, pos: 0, offs: genOffsets(PH.length), lb: null, nx: 0, ny: 0, theme, inAlbums: false };
  }
  componentDidMount() {
    this.startRack();
    this.onResize = () => { if (modeOf() !== this._lastMode) this.forceUpdate(); this.onScroll(); };
    this.onScroll = () => {
      const h = this.headEl;
      const ia = this.state.view === "top" && !!h && h.getBoundingClientRect().bottom < 80;
      if (ia !== this.state.inAlbums) this.setState({ inAlbums: ia });
    };
    this.onKey = e => {
      if (e.key === "Escape") { if (this.state.lb) this.setState({ lb: null }); else if (this.state.view === "album") this.goTop(); }
      if (this.state.view === "album" && !this.state.lb) { if (e.key === "ArrowRight") this.step(1); if (e.key === "ArrowLeft") this.step(-1); }
    };
    this.mq = window.matchMedia("(max-width: 759px)");
    this.mq.addEventListener("change", this.onResize);
    window.addEventListener("resize", this.onResize);
    window.addEventListener("scroll", this.onScroll, { passive: true });
    window.addEventListener("keydown", this.onKey);
    this._to = setTimeout(() => this.forceUpdate(), 200);
  }
  componentWillUnmount() {
    clearInterval(this.t); clearTimeout(this._to);
    this.mq.removeEventListener("change", this.onResize);
    window.removeEventListener("resize", this.onResize);
    window.removeEventListener("scroll", this.onScroll);
    window.removeEventListener("keydown", this.onKey);
  }
  startRack() { clearInterval(this.t); this.t = setInterval(() => { if (this.state.view === "top" && !this.state.lb) this.setState(s => ({ focus: (s.focus + 1) % 3 })); }, 3400); }
  albumPhotos(a) { const c = ALBUMS[a][1]; return PH.map((_, i) => PH[(c + i) % PH.length]); }
  step(d) { this.setState(s => ({ pos: Math.max(0, Math.min(PH.length - 1, s.pos + d)) })); }
  goTop = e => { if (e && e.preventDefault) e.preventDefault(); this.setState({ view: "top", lb: null, inAlbums: false }); window.scrollTo(0, 0); };
  goAlbums = e => {
    if (e && e.preventDefault) e.preventDefault();
    const run = smooth => { const f = this.fieldEl; if (f) window.scrollTo({ top: f.getBoundingClientRect().top + window.scrollY - 104, behavior: smooth ? "smooth" : "auto" }); };
    if (this.state.view !== "top") this.setState({ view: "top", lb: null }, () => requestAnimationFrame(() => { run(false); this.onScroll(); }));
    else run(true);
  };
  openAlbum(i) { this.setState({ view: "album", album: i, pos: 0, offs: genOffsets(PH.length), hov: -1, inAlbums: false }); }
  albumRef = el => {
    if (!el || el._w) return; el._w = true;
    let acc = 0, lock = 0;
    el.addEventListener("wheel", e => {
      e.preventDefault(); const now = Date.now(); if (now < lock) return;
      acc += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(acc) > 40) { this.step(acc > 0 ? 1 : -1); acc = 0; lock = now + 650; }
    }, { passive: false });
  };
  headRef = el => { this.headEl = el; };
  fieldRef = el => { this.fieldEl = el; };
  openLb(p) { this.setState({ lb: p, nx: 0, ny: 0 }); }
  toggleTheme = () => {
    const t = this.state.theme === "dark" ? "light" : "dark";
    applyTheme(t);
    try { localStorage.setItem("theme", t); } catch (e) {}
    this.setState({ theme: t });
  };
  renderVals() {
    const s = this.state, mode = modeOf(), narrow = mode === "narrow";
    this._lastMode = mode;
    if (!this._fields) this._fields = {};
    if (!this._fields[mode]) this._fields[mode] = genField(mode);
    const H = HERO[mode], F = FIELD[mode];
    const hero = H.L.map((L, i) => {
      const on = i === s.focus;
      return { ...PH[L.id], left: pct(L.x, H.W), top: pct(L.y, H.H), w: pct(L.w, H.W), h: pct(L.h, H.H), z: on ? 5 : 3 - i,
        flt: `blur(${on ? 0 : 8}px)`, op: on ? 1 : 0.7, tr: `scale(${on ? 1 : 0.95})`, tick: on ? 1 : 0.25,
        go: () => { if (on) this.openLb(PH[L.id]); else { this.setState({ focus: i }); this.startRack(); } } };
    });
    const P = this._fields[mode], fz = s.hov >= 0 ? P[s.hov].z : 0;
    const mx = s.m.x * 2 - 1, my = s.m.y * 2 - 1;
    const albums = ALBUMS.map(([t, id], i) => {
      const p = P[i], dz = Math.abs(p.z - fz), k = (4 - p.z) * 6;
      return { title: t, idx: pad(i + 1), count: pad(PH.length), src: PH[id].src, left: pct(p.x, F.W), top: pct(p.y, F.H), w: pct(p.w, F.W), z: 10 - p.z,
        flt: `blur(${(dz * 2.8).toFixed(1)}px)`, op: (1 - dz * 0.09).toFixed(2),
        tr: narrow ? "none" : `translate(${(-mx * k).toFixed(1)}px, ${(-my * k * 0.6).toFixed(1)}px)`,
        enter: () => this.setState({ hov: i }), leave: () => this.setState({ hov: -1 }),
        open: e => { e.preventDefault(); this.openAlbum(i); } };
    });
    const photos = this.albumPhotos(s.album), n = photos.length;
    const gap = narrow ? 82 : 40;
    const track = photos.map((p, i) => {
      const d = i - s.pos, ad = Math.abs(d), cl = Math.min(ad, 3);
      return { ...p, z: 10 - ad, cur: d === 0 ? "zoom-in" : "pointer", ph: narrow ? "min(52vh, calc(100vh - 260px))" : "min(62vh, calc(100vh - 260px))", pw: narrow ? "78vw" : "52vw",
        go: () => (d === 0 ? this.openLb(p) : this.setState({ pos: i })),
        tr: `translate(-50%,-50%) translate(${d * gap}vw, ${(ad ? s.offs[i] * 11 : 0).toFixed(2)}vh) scale(${(1 - Math.min(ad, 2) * 0.2).toFixed(3)})`,
        flt: `blur(${(cl * 6).toFixed(1)}px)`, op: Math.max(0, 1 - cl * 0.3).toFixed(2) };
    });
    const { nx, ny } = s;
    const suf = s.inAlbums && s.view === "top";
    return {
      wide: !narrow, isTop: s.view === "top", isAlbum: s.view === "album", goTop: this.goTop, goAlbums: this.goAlbums,
      sufOp: suf ? 1 : 0, sufTr: suf ? "translateX(0)" : "translateX(-8px)", sufPe: suf ? "auto" : "none", sufHidden: suf ? "false" : "true",
      headOp: s.inAlbums ? 0 : 1, headRef: this.headRef, fieldRef: this.fieldRef,
      toggleTheme: this.toggleTheme, themeLabel: s.theme === "dark" ? "Dark" : "Light", dotBg: s.theme === "dark" ? "currentColor" : "transparent",
      heroW: `min(100%, calc((100vh - 204px) * ${(H.W / H.H).toFixed(4)}))`, heroAR: `${H.W} / ${H.H}`,
      hero, heroTitle: PH[H.L[s.focus].id].alt,
      fieldAR: `${F.W} / ${F.H}`, albums, focusLabel: `focus ${DIST[fz]} m`,
      fieldMove: e => { if (narrow) return; const r = e.currentTarget.getBoundingClientRect(); this.setState({ m: { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height } }); },
      fieldLeave: () => this.setState({ m: { x: 0.5, y: 0.5 }, hov: -1 }),
      albumTitle: ALBUMS[s.album][0], track, count: `${pad(s.pos + 1)} / ${pad(n)}`, photoTitle: photos[s.pos].alt,
      prev: () => this.step(-1), next: () => this.step(1), prevOp: s.pos === 0 ? 0.25 : 1, nextOp: s.pos === n - 1 ? 0.25 : 1,
      albumRef: this.albumRef,
      tStart: e => { this._tx = e.touches[0].clientX; },
      tEnd: e => { const dx = e.changedTouches[0].clientX - (this._tx ?? 0); if (Math.abs(dx) > 40) this.step(dx < 0 ? 1 : -1); },
      lbOpen: !!s.lb, lbSrc: s.lb ? s.lb.src : "", lbAlt: s.lb ? s.lb.alt : "",
      lbPage: s.lb ? (s.lb.page || `https://www.flickr.com/photo.gne?id=${s.lb.id}`) : "#",
      stopProp: e => e.stopPropagation(),
      lbTransform: `translate(-50%, -50%) perspective(1000px) rotateX(${(-ny * 15).toFixed(2)}deg) rotateY(${(nx * 15).toFixed(2)}deg)`,
      lbGlare: `radial-gradient(circle at ${((nx + 1) / 2 * 100).toFixed(1)}% ${((ny + 1) / 2 * 100).toFixed(1)}%, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.15) 20%, transparent 50%)`,
      onTilt: e => { const w = window.innerWidth, hh = window.innerHeight; this.setState({ nx: Math.max(-1, Math.min(1, (e.clientX - w / 2) / (w * 0.35))), ny: Math.max(-1, Math.min(1, (e.clientY - hh / 2) / (hh * 0.35))) }); },
      resetTilt: () => this.setState({ nx: 0, ny: 0 }),
      closeLb: e => { if (e) e.stopPropagation(); this.setState({ lb: null }); }
    };
  }
}
</script>
